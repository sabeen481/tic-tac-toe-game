
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe | Neon Arena</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #080b18;
  --panel: #11172a;
  --cyan: #39e7ff;
  --pink: #ff55c8;
  --text: #f4f7ff;
  --muted: #9ba7c7;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at top, #17234a 0%, transparent 55%),
    var(--bg);
  display: flex;
  justify-content: center;
  padding: 28px 14px;
}

.container {
  width: 100%;
  max-width: 470px;
  text-align: center;
}

.logo {
  font-size: 13px;
  letter-spacing: 4px;
  color: var(--cyan);
  font-weight: bold;
  margin-bottom: 12px;
}

h1 {
  font-size: clamp(32px, 8vw, 48px);
  letter-spacing: 2px;
}

h1 span {
  color: var(--pink);
}

.subtitle {
  color: var(--muted);
  margin: 10px 0 24px;
  font-size: 14px;
}

.panel {
  background: rgba(17, 23, 42, 0.94);
  border: 1px solid #293657;
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 15px 50px #0005;
}

.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
  text-align: left;
}

label {
  font-size: 12px;
  color: var(--muted);
  display: block;
  margin-bottom: 7px;
}

select, button {
  font: inherit;
}

select {
  width: 100%;
  color: white;
  background: #1a2340;
  border: 1px solid #344366;
  border-radius: 10px;
  padding: 11px 8px;
  outline: none;
}

.scoreboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin-bottom: 20px;
}

.score {
  background: #0c1225;
  border: 1px solid #263453;
  padding: 12px 4px;
  border-radius: 13px;
}

.score .name {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 7px;
}

.score .number {
  font-size: 25px;
  font-weight: bold;
}

.x-color { color: var(--cyan); }
.o-color { color: var(--pink); }

.status {
  min-height: 26px;
  margin: 5px 0 15px;
  font-size: 15px;
  font-weight: bold;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.cell {
  aspect-ratio: 1;
  border: 1px solid #2b3b60;
  border-radius: 15px;
  background: linear-gradient(145deg, #192441, #0d1428);
  color: white;
  font-size: clamp(42px, 12vw, 62px);
  font-weight: bold;
  cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
}

.cell:hover:not(:disabled) {
  transform: translateY(-2px);
  border-color: var(--cyan);
  background: #202e4e;
}

.cell:focus-visible, button:focus-visible, select:focus-visible {
  outline: 2px solid white;
  outline-offset: 3px;
}

.cell.x {
  color: var(--cyan);
  text-shadow: 0 0 18px #39e7ff66;
}

.cell.o {
  color: var(--pink);
  text-shadow: 0 0 18px #ff55c866;
}

.cell.win {
  background: #243653;
  border-color: #8affbd;
  box-shadow: 0 0 18px #8affbd33;
}

.cell:disabled {
  cursor: default;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.action {
  border: 0;
  padding: 13px 8px;
  border-radius: 11px;
  font-weight: bold;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
}

.action:hover {
  transform: translateY(-2px);
  opacity: .9;
}

.primary {
  color: #07101e;
  background: linear-gradient(100deg, var(--cyan), #88f7df);
}

.secondary {
  color: white;
  background: #263453;
  border: 1px solid #3b4c70;
}

.hint {
  color: var(--muted);
  font-size: 12px;
  margin-top: 18px;
  line-height: 1.6;
}

footer {
  margin-top: 22px;
  color: #657294;
  font-size: 11px;
  letter-spacing: 2px;
}

@media (max-width: 360px) {
  .panel { padding: 13px; }
  .board { gap: 7px; }
  .cell { border-radius: 11px; }
}
</style>
</head>

<body>
<main class="container">
  <div class="logo">✦ ARCADE EXPERIENCE ✦</div>
  <h1>TIC <span>TAC</span> TOE</h1>
  <p class="subtitle">Think smart. Make your move. Win the game.</p>

  <section class="panel">
    <div class="settings">
      <div>
        <label for="mode">GAME MODE</label>
        <select id="mode">
          <option value="ai">Human vs Robot</option>
          <option value="human">Human vs Human</option>
        </select>
      </div>
      <div>
        <label for="difficulty">ROBOT LEVEL</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score">
        <div class="name" id="xName">YOU · X</div>
        <div class="number x-color" id="xScore">0</div>
      </div>
      <div class="score">
        <div class="name">DRAWS</div>
        <div class="number" id="drawScore">0</div>
      </div>
      <div class="score">
        <div class="name" id="oName">ROBOT · O</div>
        <div class="number o-color" id="oScore">0</div>
      </div>
    </div>

    <div class="status" id="status" aria-live="polite">
      Your turn — make a move!
    </div>

    <div class="board" id="board" aria-label="Tic Tac Toe board">
      <button class="cell" data-i="0" aria-label="Cell 1"></button>
      <button class="cell" data-i="1" aria-label="Cell 2"></button>
      <button class="cell" data-i="2" aria-label="Cell 3"></button>
      <button class="cell" data-i="3" aria-label="Cell 4"></button>
      <button class="cell" data-i="4" aria-label="Cell 5"></button>
      <button class="cell" data-i="5" aria-label="Cell 6"></button>
      <button class="cell" data-i="6" aria-label="Cell 7"></button>
      <button class="cell" data-i="7" aria-label="Cell 8"></button>
      <button class="cell" data-i="8" aria-label="Cell 9"></button>
    </div>

    <div class="buttons">
      <button class="action primary" id="newGame">↻ New Game</button>
      <button class="action secondary" id="reset">Reset Scores</button>
    </div>

    <p class="hint">
      💡 Tip: Control the center and corners to improve your chances.
    </p>
  </section>

  <footer>NEON ARENA · PLAY YOUR WAY</footer>
</main>

<script>
const cells = [...document.querySelectorAll(".cell")];
const mode = document.getElementById("mode");
const difficulty = document.getElementById("difficulty");
const statusText = document.getElementById("status");

const xScoreText = document.getElementById("xScore");
const oScoreText = document.getElementById("oScore");
const drawScoreText = document.getElementById("drawScore");
const xName = document.getElementById("xName");
const oName = document.getElementById("oName");

const winningLines = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],
  [0, 3, 6], [1, 4, 7], [2, 5, 8],
  [0, 4, 8], [2, 4, 6]
];

let board = Array(9).fill("");
let current = "X";
let gameOver = false;
let scores = { X: 0, O: 0, draw: 0 };
let thinking = false;

function getWinner(state) {
  for (const line of winningLines) {
    const [a, b, c] = line;
    if (state[a] && state[a] === state[b] &&
        state[a] === state[c]) {
      return { winner: state[a], line };
    }
  }
  return null;
}

function render() {
  cells.forEach((cell, i) => {
    cell.textContent = board[i];
    cell.classList.toggle("x", board[i] === "X");
    cell.classList.toggle("o", board[i] === "O");
    cell.classList.remove("win");

    const result = getWinner(board);
    if (result && result.line.includes(i)) {
      cell.classList.add("win");
    }

    cell.disabled = gameOver || thinking || board[i] !== "";
    cell.setAttribute(
      "aria-label",
      `Cell ${i + 1}${board[i] ? ", " + board[i] : ", empty"}`
    );
  });

  xScoreText.textContent = scores.X;
  oScoreText.textContent = scores.O;
  drawScoreText.textContent = scores.draw;

  xName.textContent = mode.value === "ai" ? "YOU · X" : "PLAYER 1 · X";
  oName.textContent = mode.value === "ai" ? "ROBOT · O" : "PLAYER 2 · O";
  difficulty.disabled = mode.value === "human";
}

function updateStatus(message) {
  statusText.textContent = message;
}

function finishGame() {
  const result = getWinner(board);

  if (result) {
    gameOver = true;
    scores[result.winner]++;
    updateStatus(
      result.winner === "X"
        ? (mode.value === "ai" ? "🎉 You win! Amazing!" : "🎉 Player 1 wins!")
        : (mode.value === "ai" ? "🤖 Robot wins! Try again!" : "🎉 Player 2 wins!")
    );
    render();
    return true;
  }

  if (board.every(Boolean)) {
    gameOver = true;
    scores.draw++;
    updateStatus("🤝 It's a draw! Well played.");
    render();
    return true;
  }

  return false;
}

function playMove(index) {
  if (gameOver || thinking || board[index]) return;

  board[index] = current;

  if (finishGame()) return;

  current = current === "X" ? "O" : "X";
  render();

  if (mode.value === "ai" && current === "O") {
    thinking = true;
    render();
    updateStatus("🤖 Robot is thinking...");

    // Short pause makes the robot's turn feel natural.
    window.setTimeout(() => {
      if (gameOver || mode.value !== "ai") {
        thinking = false;
        render();
        return;
      }

      const move = chooseRobotMove();
      thinking = false;

      if (move !== -1) {
        board[move] = "O";
        if (!finishGame()) {
          current = "X";
          updateStatus("Your turn — make a move!");
        }
      }

      render();
    }, 350);
  } else {
    updateStatus(current === "X"
      ? (mode.value === "ai" ? "Your turn — make a move!" : "Player 1's turn (X)")
      : "Player 2's turn (O)");
  }
}

function chooseRobotMove() {
  const empty = board
    .map((value, i) => value === "" ? i : -1)
    .filter(i => i !== -1);

  if (!empty.length) return -1;

  // Easy level: random legal move.
  if (difficulty.value === "easy") {
    return empty[Math.floor(Math.random() * empty.length)];
  }

  // Medium and hard: first win, then block, then use strategy.
  const winMove = findImmediateMove("O");
  if (winMove !== -1) return winMove;

  const blockMove = findImmediateMove("X");
  if (blockMove !== -1) return blockMove;

  if (difficulty.value === "hard") {
    return bestMove();
  }

  if (board[4] === "") return 4;

  const corners = [0, 2, 6, 8].filter(i => board[i] === "");
  if (corners.length) {
    return corners[Math.floor(Math.random() * corners.length)];
  }

  return empty[Math.floor(Math.random() * empty.length)];
}

function findImmediateMove(player) {
  for (let i = 0; i < 9; i++) {
    if (board[i] !== "") continue;

    board[i] = player;
    const wins = Boolean(getWinner(board));
    board[i] = "";

    if (wins) return i;
  }
  return -1;
}

function bestMove() {
  let bestScore = -Infinity;
  let move = -1;

  for (let i = 0; i < 9; i++) {
    if (board[i] !== "") continue;

    board[i] = "O";
    const score = minimax(board, 0, false);
    board[i] = "";

    if (score > bestScore) {
      bestScore = score;
      move = i;
    }
  }
  return move;
}

function minimax(state, depth, maximizing) {
  const result = getWinner(state);

  if (result) {
    return result.winner === "O" ? 10 - depth : depth - 10;
  }

  if (state.every(Boolean)) return 0;

  if (maximizing) {
    let best = -Infinity;

    for (let i = 0; i < 9; i++) {
      if (state[i] !== "") continue;
      state[i] = "O";
      best = Math.max(best, minimax(state, depth + 1, false));
      state[i] = "";
    }

    return best;
  }

  let best = Infinity;

  for (let i = 0; i < 9; i++) {
    if (state[i] !== "") continue;
    state[i] = "X";
    best = Math.min(best, minimax(state, depth + 1, true));
    state[i] = "";
  }

  return best;
}

function newGame() {
  board = Array(9).fill("");
  current = "X";
  gameOver = false;
  thinking = false;
  updateStatus(mode.value === "ai"
    ? "Your turn — make a move!"
    : "Player 1's turn (X)");
  render();
}

cells.forEach(cell => {
  cell.addEventListener("click", () => {
    playMove(Number(cell.dataset.i));
  });
});

document.getElementById("newGame").addEventListener("click", newGame);

document.getElementById("reset").addEventListener("click", () => {
  scores = { X: 0, O: 0, draw: 0 };
  newGame();
});

mode.addEventListener("change", newGame);
difficulty.addEventListener("change", newGame);

render();
</script>
</body>
</html>
